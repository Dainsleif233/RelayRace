command.config.playtime.get: "<green>Current playtime: {seconds} seconds"
command.config.playtime.running: "<red>Cannot change playtime while game is running."
command.config.playtime.set: "<green>Playtime set to {seconds} seconds."
command.config.debug.status: "<green>Debug mode: {value}"
