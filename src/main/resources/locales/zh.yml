game.end.cleared: "<gold>游戏通关！"
game.end.over: "<red>游戏结束"
game.end.subtitle: "<white>总用时: {time}"
game.reminder.next: "<yellow>即将轮到您上场，剩余 {seconds} 秒。"
game.lobby.sent: "<yellow>您已被传送至大厅服务器，请耐心等待上场。"
game.lobby.bringback: "<green>正在将您传送回游戏服务器，请稍候。"
