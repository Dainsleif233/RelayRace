# --- Game Messages ---

game.bossbar.title: "<green>Total {elapsed} | Round {remaining}"
game.countdown.number: "<gold><bold>{number}"
game.go.title: "<green><bold>GO!"
game.end.cleared: "<gold>Game Cleared!"
game.end.over: "<red>Game Over"
game.end.subtitle: "<white>Total time: {time}"
game.reminder.next: "<yellow>You are next. {seconds} seconds remaining."
game.lobby.sent: "<yellow>You have been transferred to the lobby server. Please wait for your turn."
game.lobby.bringback: "<green>Returning you to the game server. Please stand by."
